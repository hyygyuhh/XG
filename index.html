<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双手拉嘴 · 试用台</title>
<style>
:root{color-scheme:dark;--bg:#171523;--panel:#221e30;--line:#383246;--ink:#fbf6ee;--muted:#c2b8cb;--accent:#d8fa9f;--radius:17px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1150px;margin:auto;padding:clamp(22px,5vw,62px) clamp(16px,4vw,50px)}
header{margin-bottom:25px} .edition{display:inline-block;color:var(--accent);font:700 12px/1.3 ui-monospace,monospace;letter-spacing:.13em}
h1{font-size:clamp(30px,5vw,52px);line-height:1.12;letter-spacing:-.055em;margin:9px 0 8px} p{margin:0;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(245px,320px);gap:16px;align-items:start}
.stage{border:1px solid var(--line);background:#1c1929;border-radius:var(--radius);overflow:hidden;min-width:0}
.bar{min-height:48px;padding:8px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar strong{font-size:13px} #status{font-size:12px;color:var(--muted)} canvas{display:block;width:100%;height:auto;background:#292739}
progress{display:block;width:100%;height:4px;appearance:none;border:0;background:var(--line)}
progress::-webkit-progress-bar{background:var(--line)} progress::-webkit-progress-value{background:var(--accent)}
progress::-moz-progress-bar{background:var(--accent)}
.inputs{display:flex;gap:7px;flex-wrap:wrap;padding:11px 13px}
button,.file{font:inherit;cursor:pointer;color:var(--ink);background:#2c263c;border:1px solid #463d59;border-radius:10px;min-height:44px;padding:8px 12px;transition:background .16s,transform .16s}
button:hover,.file:hover{background:#413653} button:active,.file:active{transform:scale(.975)}
button:focus-visible,.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button:disabled,.file:has(input:disabled){opacity:.55;cursor:wait} .primary{background:var(--accent);border-color:var(--accent);color:#22291a;font-weight:700}
.primary:hover{background:#e6ffbd} .file{position:relative;display:inline-flex;align-items:center}.file input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
aside{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px}
h2{font-size:17px;margin:0 0 12px}.actions{display:grid;gap:8px}
.effect{width:100%;display:grid;grid-template-columns:31px 1fr auto;gap:8px;text-align:left;align-items:center;min-height:69px}
.effect[aria-pressed=true]{border-color:var(--tint);background:#382e48}.number{color:var(--tint);font:700 12px ui-monospace,monospace}
.effect b,.effect small{display:block}.effect small,.time,.hint{font-size:12px;color:var(--muted)} .time{white-space:nowrap}
.hint{margin:13px 0 0} .loading{animation:pulse 1.1s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.55}}
@media(max-width:740px){.layout{grid-template-columns:1fr}} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header><span class="edition">LIVE FX / 01</span><h1>双手拉嘴</h1><p>开启摄像头，双手接触嘴角后向两侧拉动。</p></header>
<div class="layout">
  <section class="stage" aria-label="效果预览">
    <div class="bar"><strong id="source">内置插画</strong><span id="status" role="status">正在准备预览</span></div>
    <canvas id="output" width="640" height="480" aria-label="实时特效合成画面"></canvas>
    <progress id="progress" max="2000" value="0" aria-label="动作进度"></progress>
    <div class="inputs">
      <button type="button" class="primary" id="camera">开启摄像头</button>
      <label class="file">选照片<input id="photo" type="file" accept="image/*" aria-label="选照片"></label>
      <button type="button" id="demo">内置插画</button>
    </div>
  </section>
  <aside><h2>动作样板</h2><div id="actions" class="actions"></div><p class="hint">点击“双指扯嘴”，双手先接触嘴角，再向两侧拉动并张嘴。松手后恢复，画面在本机处理。</p></aside>
</div>
</main>
<video id="video" hidden muted playsinline></video>
<script type="module" src="./preview.mjs"></script>
</body>
</html>
